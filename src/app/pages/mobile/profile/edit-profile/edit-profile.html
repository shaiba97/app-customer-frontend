<section dir="rtl" class="min-h-full bg-[var(--bg-base)] flex flex-col">
  <header class="bg-[var(--bg-card)] px-4 py-4 border-b border-[var(--border)] flex items-center gap-3">
    <button type="button" (click)="goBack()" [attr.aria-label]="'العودة للخلف'" class="p-1 -m-1 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-[var(--primary)]">
      <svg class="w-5 h-5 text-[var(--text-primary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <h1 class="text-[18px] font-extrabold text-[var(--text-primary)]">تعديل الحساب</h1>
  </header>

  <div class="flex flex-col gap-3.5 p-4">
    @if (success()) {
      <div role="status" class="flex items-start gap-2 px-3 py-3 rounded-[10px] bg-emerald-50 border border-emerald-200">
        <svg lucideCheckCircle2 class="w-[18px] h-[18px] text-[#059669] flex-shrink-0 mt-0.5" aria-hidden="true"></svg>
        <p class="text-[13px] text-[#059669] font-semibold flex-1">{{ success() }}</p>
      </div>
    }

    @if (error()) {
      <div role="alert" class="flex items-start gap-2 px-3 py-3 rounded-[10px] bg-[#FEE2E2]">
        <svg lucideAlertCircle class="w-[18px] h-[18px] text-[#DC2626] flex-shrink-0 mt-0.5" aria-hidden="true"></svg>
        <p class="text-[13px] text-[#DC2626] font-medium flex-1">{{ error() }}</p>
      </div>
    }

    <div class="bg-[var(--bg-card)] rounded-2xl border border-[var(--border)] p-4 flex flex-col gap-3.5">
      <div class="flex items-center gap-3 px-4 py-3.5 rounded-2xl border border-[var(--border)] bg-[var(--bg-base)]">
        <svg lucideUser class="w-5 h-5 text-[#6B7280] flex-shrink-0" aria-hidden="true"></svg>
        <input type="text" [ngModel]="name()" (ngModelChange)="name.set($event)" name="name" placeholder="الاسم الكامل" class="flex-1 bg-transparent outline-none text-[15px] font-semibold text-right text-[var(--text-primary)] placeholder:text-[#6B7280] placeholder:font-normal">
      </div>
      @if (nameError()) {
        <p class="text-[12px] font-semibold text-[#DC2626] -mt-2 px-1">{{ nameError() }}</p>
      }

      <div class="flex items-center gap-3 px-4 py-3.5 rounded-2xl border border-[var(--border)] bg-[var(--bg-base)]">
        <svg lucidePhone class="w-5 h-5 text-[#6B7280] flex-shrink-0" aria-hidden="true"></svg>
        <input type="tel" [ngModel]="phone()" (ngModelChange)="phone.set($event)" name="phone" placeholder="رقم الهاتف" dir="ltr" class="flex-1 bg-transparent outline-none text-[15px] font-semibold text-right text-[var(--text-primary)] placeholder:text-[#6B7280] placeholder:font-normal">
      </div>

      <div class="flex items-center gap-3 px-4 py-3.5 rounded-2xl border border-[var(--border)] bg-[var(--bg-base)]">
        <svg lucideMail class="w-5 h-5 text-[#6B7280] flex-shrink-0" aria-hidden="true"></svg>
        <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" placeholder="البريد الإلكتروني" dir="ltr" class="flex-1 bg-transparent outline-none text-[15px] font-semibold text-right text-[var(--text-primary)] placeholder:text-[#6B7280] placeholder:font-normal">
      </div>

      <div class="flex items-center gap-3 px-4 py-3.5 rounded-2xl border border-[var(--border)] bg-[var(--bg-base)]">
        <svg lucideLock class="w-5 h-5 text-[#6B7280] flex-shrink-0" aria-hidden="true"></svg>
        <input [type]="showPassword() ? 'text' : 'password'" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" placeholder="كلمة المرور الجديدة (اترك فارغ للإبقاء)" dir="ltr" class="flex-1 bg-transparent outline-none text-[15px] font-semibold text-right text-[var(--text-primary)] placeholder:text-[#6B7280] placeholder:font-normal">
        <button type="button" (click)="togglePassword()" [attr.aria-label]="showPassword() ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'" class="flex-shrink-0 p-1 -m-1 rounded-full focus:outline-none focus-visible:ring-2 focus-visible:ring-[var(--primary)]">
          @if (showPassword()) {
            <svg lucideEyeOff class="w-5 h-5 text-[#6B7280]" aria-hidden="true"></svg>
          } @else {
            <svg lucideEye class="w-5 h-5 text-[#6B7280]" aria-hidden="true"></svg>
          }
        </button>
      </div>
      @if (passwordError()) {
        <p class="text-[12px] font-semibold text-[#DC2626] -mt-2 px-1">{{ passwordError() }}</p>
      }
    </div>

    <button type="button" (click)="save()" [disabled]="isSaving()" class="mt-1 h-[50px] w-full rounded-[12px] bg-[var(--primary)] text-white text-[15px] font-extrabold flex items-center justify-center gap-2 active:scale-[0.98] transition-all duration-150 disabled:opacity-60 disabled:cursor-not-allowed">
      @if (isSaving()) {
        <span class="w-[22px] h-[22px] border-2 border-white border-t-transparent rounded-full animate-spin" aria-hidden="true"></span>
      } @else {
        <span>حفظ التغييرات</span>
      }
    </button>
  </div>
</section>
