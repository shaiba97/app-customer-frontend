<section dir="rtl" class="min-h-full bg-[var(--bg-base)] flex flex-col">
  <header class="bg-[var(--bg-card)] px-4 py-4 border-b border-[var(--border)]">
    <h1 class="text-[18px] font-extrabold text-[var(--text-primary)]">حسابي</h1>
  </header>

  @if (notice()) {
    <div role="status" class="mx-4 mt-3 px-3 py-2.5 rounded-xl bg-[var(--bg-card)] border border-[var(--border)] text-[13px] font-bold text-[var(--text-primary)] text-center shadow-sm">
      {{ notice() }}
    </div>
  }

  @if (isLoggedIn()) {
    <div class="flex flex-col gap-3.5 p-4">
      <div class="bg-[var(--bg-card)] rounded-[14px] border-[1.5px] border-[var(--border)] p-4 flex items-center gap-3" aria-label="معلومات الحساب">
        <div class="w-14 h-14 rounded-full bg-[var(--primary-light)] flex items-center justify-center flex-shrink-0">
          <span class="text-[18px] font-extrabold text-[var(--primary)]">{{ initials() }}</span>
        </div>
        <div class="flex flex-col min-w-0 flex-1">
          <span class="text-[15.5px] font-extrabold text-[var(--text-primary)] truncate">{{ customerName() }}</span>
          @if (customerPhone()) {
            <span class="text-[12.5px] text-[var(--text-secondary)]" dir="ltr">{{ customerPhone() }}</span>
          }
          @if (customerEmail()) {
            <span class="text-[12.5px] text-[var(--text-muted)] truncate">{{ customerEmail() }}</span>
          }
        </div>
      </div>

      <nav class="flex flex-col" aria-label="قائمة الحساب">
        <button type="button" (click)="goToEditProfile()" class="flex items-center justify-between w-full px-3.5 py-[13px] mb-2.5 rounded-[14px] bg-[var(--bg-card)] border-[1.5px] border-[var(--border)] active:scale-[0.99] transition-all">
          <div class="flex items-center gap-2.5 flex-1 min-w-0">
            <svg class="w-5 h-5 text-[var(--text-primary)] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="M15 5l4 4"/></svg>
            <span class="text-[13.5px] font-bold text-[var(--text-primary)]">تعديل الحساب</span>
          </div>
          <svg class="w-5 h-5 text-[var(--border)] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>

        <button type="button" (click)="goToAwards()" class="flex items-center justify-between w-full px-3.5 py-[13px] mb-2.5 rounded-[14px] bg-[var(--bg-card)] border-[1.5px] border-[var(--border)] active:scale-[0.99] transition-all">
          <div class="flex items-center gap-2.5 flex-1 min-w-0">
            <svg class="w-5 h-5 text-[var(--text-primary)] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
            <span class="text-[13.5px] font-bold text-[var(--text-primary)]">المكافآت</span>
          </div>
          <svg class="w-5 h-5 text-[var(--border)] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>

        <button type="button" (click)="goToBookings()" class="flex items-center justify-between w-full px-3.5 py-[13px] mb-2.5 rounded-[14px] bg-[var(--bg-card)] border-[1.5px] border-[var(--border)] active:scale-[0.99] transition-all">
          <div class="flex items-center gap-2.5 flex-1 min-w-0">
            <svg class="w-5 h-5 text-[var(--text-primary)] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="9 16 11 18 15 14"/></svg>
            <span class="text-[13.5px] font-bold text-[var(--text-primary)]">حجوزاتي</span>
          </div>
          <svg class="w-5 h-5 text-[var(--border)] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>

        <button type="button" (click)="helpComingSoon()" class="flex items-center justify-between w-full px-3.5 py-[13px] mb-2.5 rounded-[14px] bg-[var(--bg-card)] border-[1.5px] border-[var(--border)] active:scale-[0.99] transition-all">
          <div class="flex items-center gap-2.5 flex-1 min-w-0">
            <svg class="w-5 h-5 text-[var(--text-primary)] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span class="text-[13.5px] font-bold text-[var(--text-primary)]">مساعدة</span>
          </div>
          <svg class="w-5 h-5 text-[var(--border)] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>

        <button type="button" (click)="openLogoutConfirm()" class="flex items-center justify-between w-full px-3.5 py-[13px] rounded-[14px] bg-[var(--bg-card)] border-[1.5px] border-[var(--border)] active:scale-[0.99] transition-all">
          <div class="flex items-center gap-2.5 flex-1 min-w-0">
            <svg class="w-5 h-5 text-[var(--danger)] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span class="text-[13.5px] font-bold text-[var(--danger)]">تسجيل الخروج</span>
          </div>
          <svg class="w-5 h-5 text-[var(--border)] flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </nav>
    </div>

    @if (showConfirmLogout()) {
      <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4" (click)="cancelLogout()">
        <aside role="dialog" aria-modal="true" aria-label="تسجيل الخروج" class="bg-[var(--bg-card)] rounded-2xl max-w-sm w-full flex flex-col gap-5 shadow-xl" (click)="$event.stopPropagation()">
          <div class="px-6 pt-6">
            <h2 class="text-[17px] font-extrabold text-[var(--text-primary)] text-center">تسجيل الخروج؟</h2>
          </div>
          <div class="px-6 pb-6 flex items-center justify-center gap-3">
            <button type="button" (click)="confirmLogout()" class="flex-1 py-3 rounded-full bg-[var(--danger)] text-white font-bold text-[14px] active:scale-[0.98] transition-all">
              خروج
            </button>
            <button type="button" (click)="cancelLogout()" class="flex-1 py-3 rounded-full text-[var(--text-secondary)] font-bold text-[14px] active:scale-[0.98] transition-all">
              إلغاء
            </button>
          </div>
        </aside>
      </div>
    }

  } @else {
    <div class="flex-1 flex flex-col items-center justify-center px-6 gap-5 text-center">
      <div class="w-16 h-16 rounded-full bg-[var(--bg-card)] border-2 border-[var(--border)] flex items-center justify-center">
        <svg class="w-8 h-8 text-[var(--text-secondary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="flex flex-col gap-1">
        <p class="text-[16px] font-bold text-[var(--text-primary)]">تسجيل الدخول</p>
        <span class="text-[13px] text-[var(--text-secondary)]">سجل الدخول لمتابعة حجوزاتك</span>
      </div>
      <button type="button" (click)="login()" class="flex items-center justify-center gap-2 px-8 py-3.5 rounded-2xl bg-[var(--primary)] text-white font-bold text-[15px] active:scale-[0.98] transition-all shadow-lg">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        <span>تسجيل الدخول</span>
      </button>
    </div>
  }
</section>
