<section dir="rtl" class="min-h-screen bg-[var(--bg-base)] flex items-center justify-center px-6 py-10 overflow-y-auto">
  <div class="w-full max-w-sm flex flex-col items-center">
    <img ngSrc="/customerLogo.png" width="80" height="80" class="w-20 h-20 rounded-2xl" alt="شعار تفية">
    <h1 class="mt-2 text-[22px] font-extrabold text-[var(--primary)]">تفية</h1>

    <form class="mt-6 w-full flex flex-col gap-3.5" (ngSubmit)="submit()">
      <div class="flex items-center gap-3 px-4 py-3.5 rounded-2xl border border-[var(--border)] bg-[var(--bg-card)]">
        <svg lucideUser class="w-5 h-5 text-[#6B7280] flex-shrink-0" aria-hidden="true"></svg>
        <input type="text" [ngModel]="name()" (ngModelChange)="name.set($event)" name="name" placeholder="الاسم الكامل" class="flex-1 bg-transparent outline-none text-[15px] font-semibold text-[var(--text-primary)] placeholder:text-[var(--text-secondary)] placeholder:font-normal">
      </div>

      <div class="flex items-stretch gap-2">
        <div class="flex items-center px-3 rounded-2xl border border-[var(--border)] bg-[var(--bg-base)] flex-shrink-0">
          <span class="text-[13px] font-bold text-[var(--text-primary)]">SD +249</span>
        </div>
        <div class="flex items-center gap-3 px-4 py-3.5 rounded-2xl border border-[var(--border)] bg-[var(--bg-card)] flex-1 min-w-0">
          <svg lucidePhone class="w-5 h-5 text-[#6B7280] flex-shrink-0" aria-hidden="true"></svg>
          <input type="text" inputmode="numeric" [ngModel]="phone()" (ngModelChange)="phone.set($event)" name="phone" placeholder="9 أرقام" dir="ltr" maxlength="9" aria-describedby="phone-hint" class="flex-1 min-w-0 bg-transparent outline-none text-[15px] font-semibold text-right text-[var(--text-primary)] placeholder:text-[var(--text-secondary)] placeholder:font-normal">
        </div>
      </div>
      <span id="phone-hint" class="sr-only">رقم هاتف سوداني مكوّن من 9 أرقام</span>

      <div class="flex items-center gap-3 px-4 py-3.5 rounded-2xl border border-[var(--border)] bg-[var(--bg-card)]">
        <svg lucideLock class="w-5 h-5 text-[#6B7280] flex-shrink-0" aria-hidden="true"></svg>
        <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" placeholder="كلمة المرور (6 أحرف)" dir="ltr" class="flex-1 bg-transparent outline-none text-[15px] font-semibold text-right text-[var(--text-primary)] placeholder:text-[var(--text-secondary)] placeholder:font-normal">
      </div>

      <label class="flex items-start gap-3 cursor-pointer group">
        <input type="checkbox" [ngModel]="agreedToTerms()" (ngModelChange)="agreedToTerms.set($event)" name="agree" class="peer sr-only" aria-label="الموافقة على الشروط والأحكام وسياسة الخصوصية">
        <div class="w-5 h-5 rounded-md border-2 border-[var(--border)] bg-[var(--bg-card)] peer-checked:bg-[var(--primary)] peer-checked:border-[var(--primary)] transition-all duration-150 flex items-center justify-center flex-shrink-0 mt-0.5">
          <svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100 transition-opacity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <span class="text-[13px] text-[#6B7280] leading-relaxed">
          أوافق على
          <a routerLink="/terms" class="text-[var(--primary)] font-bold underline-offset-2 hover:underline">الشروط والأحكام</a>
          و
          <a routerLink="/terms" class="text-[var(--primary)] font-bold underline-offset-2 hover:underline">سياسة الخصوصية</a>
        </span>
      </label>

      @if (error()) {
        <div role="alert" class="flex items-start gap-2 px-3 py-3 rounded-[10px] bg-[#FEE2E2]">
          <svg lucideAlertCircle class="w-[18px] h-[18px] text-[#DC2626] flex-shrink-0 mt-0.5" aria-hidden="true"></svg>
          <p class="text-[13px] text-[#DC2626] font-medium flex-1">{{ error() }}</p>
        </div>
      }

      <button type="button" (click)="submit()" [disabled]="isLoading()" class="mt-4 h-[50px] w-full rounded-[12px] bg-[var(--primary)] text-white text-[15px] font-extrabold flex items-center justify-center gap-2 active:scale-[0.98] transition-all duration-150 disabled:opacity-60 disabled:cursor-not-allowed">
        @if (isLoading()) {
          <span class="w-[22px] h-[22px] border-2 border-white border-t-transparent rounded-full animate-spin" aria-hidden="true"></span>
        } @else {
          <span>إنشاء الحساب</span>
        }
      </button>

      <a (click)="goToLogin()" class="text-center text-[13px] font-bold text-[var(--primary)] cursor-pointer mt-3">لديك حساب؟ سجّل الدخول</a>
    </form>
  </div>
</section>
