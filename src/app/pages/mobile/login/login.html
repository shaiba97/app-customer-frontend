<section dir="rtl" class="min-h-screen bg-[var(--bg-base)] flex items-center justify-center px-6 py-10 overflow-y-auto">
  <div class="w-full max-w-sm flex flex-col items-center">
    <img ngSrc="/customerLogo.png" width="80" height="80" class="w-20 h-20 rounded-2xl" alt="شعار تفية">
    <h1 class="mt-2 text-[22px] font-extrabold text-[var(--primary)]">تفية</h1>

    <div class="mt-3.5 w-full">
      <h2 class="text-center text-[20px] font-extrabold text-[var(--text-primary)]">تسجيل الدخول</h2>
      <p class="mt-1 text-center text-[13px] text-[#6B7280]">مرحباً بعودتك إلى تفيّة</p>
    </div>

    <form class="mt-6 w-full flex flex-col gap-3.5" (ngSubmit)="submit()">
      <div class="flex items-center gap-3 px-4 py-3.5 rounded-2xl border border-[var(--border)] bg-[var(--bg-card)]">
        <svg lucideUser class="w-5 h-5 text-[#6B7280] flex-shrink-0" aria-hidden="true"></svg>
        <input type="text" inputmode="email" [ngModel]="identifier()" (ngModelChange)="identifier.set($event)" name="identifier" placeholder="البريد الإلكتروني أو رقم الهاتف" dir="ltr" class="flex-1 bg-transparent outline-none text-[15px] font-semibold text-right text-[var(--text-primary)] placeholder:text-[var(--text-secondary)] placeholder:font-normal">
      </div>

      <div class="flex items-center gap-3 px-4 py-3.5 rounded-2xl border border-[var(--border)] bg-[var(--bg-card)]">
        <svg lucideLock class="w-5 h-5 text-[#6B7280] flex-shrink-0" aria-hidden="true"></svg>
        <input [type]="showPassword() ? 'text' : 'password'" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password" placeholder="كلمة المرور" dir="ltr" class="flex-1 bg-transparent outline-none text-[15px] font-semibold text-right text-[var(--text-primary)] placeholder:text-[var(--text-secondary)] placeholder:font-normal">
        <button type="button" (click)="showPassword.set(!showPassword())" [attr.aria-label]="showPassword() ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'" class="flex-shrink-0 p-1 -m-1 rounded-full focus:outline-none focus-visible:ring-2 focus-visible:ring-[var(--primary)]">
          @if (showPassword()) {
            <svg lucideEyeOff class="w-5 h-5 text-[#6B7280]" aria-hidden="true"></svg>
          } @else {
            <svg lucideEye class="w-5 h-5 text-[#6B7280]" aria-hidden="true"></svg>
          }
        </button>
      </div>

      @if (error()) {
        <div role="alert" class="flex items-start gap-2 px-3 py-3 rounded-[10px] bg-[#FEE2E2]">
          <svg lucideAlertCircle class="w-[18px] h-[18px] text-[#DC2626] flex-shrink-0 mt-0.5" aria-hidden="true"></svg>
          <p class="text-[13px] text-[#DC2626] font-medium flex-1">{{ error() }}</p>
        </div>
      }

      <button type="button" (click)="submit()" [disabled]="isLoading()" class="mt-4 h-[50px] w-full rounded-[12px] bg-[var(--primary)] text-white text-[15px] font-extrabold flex items-center justify-center gap-2 active:scale-[0.98] transition-all duration-150 disabled:opacity-60 disabled:cursor-not-allowed">
        @if (isLoading()) {
          <span class="w-[22px] h-[22px] border-2 border-white border-t-transparent rounded-full animate-spin" aria-hidden="true"></span>
        } @else {
          <span>دخول</span>
        }
      </button>

      <a (click)="goToRegister()" class="text-center text-[13px] font-bold text-[var(--primary)] cursor-pointer mt-3">ليس لديك حساب؟ سجّل الآن</a>

      <p class="text-center text-[12px] text-[#6B7280] mt-1">
        أوافق على
        <a routerLink="/terms" class="text-[var(--primary)] font-bold underline">الشروط والأحكام</a>
        و
        <a routerLink="/terms" class="text-[var(--primary)] font-bold underline">سياسة الخصوصية</a>
      </p>
    </form>
  </div>
</section>
